[build]
  publish = "."
  functions = "functions"
  command = "echo 'No build step needed'"

[functions]
  node_bundler = "esbuild"

# /api/* is also declared inside the function via `export const config`,
# this redirect keeps older Netlify runtimes working too.
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
